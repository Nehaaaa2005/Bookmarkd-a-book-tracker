
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>My Book Tracker</h1>
        <p class="subtitle">Keep track of the books you're reading.</p>

        <form id="book-form" novalidate>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter book title">
                <small class="error" id="title-error"></small>
            </div>

            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" placeholder="Enter author name">
                <small class="error" id="author-error"></small>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                    <option value="To read">To read</option>
                    <option value="Reading">Reading</option>
                    <option value="Finished">Finished</option>
                </select>
            </div>
            
            <p id="duplicate-error" class="error"></p>

            <button type="submit">Add Book</button>
        </form>

        <section class="book-section">
            <h2>My Books</h2>
            
            <input
               type="text"
               id="search-input"
               placeholder="Search by title or author..."
               aria-label="Search books by title or author"
            >
            
            
            <div id="status-summary">
                <span>To read: <strong id="to-read-count">0</strong></span>
                <span>Reading: <strong id="reading-count">0</strong></span>
                <span>Finished: <strong id="finished-count">0</strong></span>
            </div>

            <p id="empty-message">No books added yet. Add your first book above!</p>
            <ul id="book-list"></ul>
        </section>
    </main>
</body>
</html>
